<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUDS - Product Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <h1>CRUDS</h1>
            <p>PRODUCT MANAGEMENT SYSTEM</p>
        </header>


        <!-- Product Form -->
        <form id="productForm" class="product-form">

            <!-- Title -->
            <input type="text" id="title" name="title" placeholder="Product Title" autocomplete="off">


            <!-- Price Details -->
            <div class="price-row">

                <input onkeyup="getTotal()" type="number" id="price" name="price" placeholder="Price" min="0">

                <input onkeyup="getTotal()" type="number" id="taxes" name="taxes" placeholder="Taxes" min="0">

                <input onkeyup="getTotal()" type="number" id="ads" name="ads" placeholder="Ads" min="0">

                <input onkeyup="getTotal()" type="number" id="discount" name="discount" placeholder="Discount" min="0">

                <div class="total-box">
                    <span>Total:</span>
                    <strong id="total">0</strong>
                </div>

            </div>


            <!-- Count -->
            <input type="number" id="count" name="count" placeholder="Count" min="1" class="count-input">


            <!-- Category -->
            <input type="text" id="category" name="category" placeholder="Category" autocomplete="off"
                class="category-input">


            <!-- Create / Update -->
            <button type="submit" id="submitBtn" class="primary-btn">
                Create Product
            </button>

        </form>


        <!-- Search -->
        <section class="search-section">

            <input type="search" id="search" placeholder="Search..." autocomplete="off">

            <div class="search-buttons">

                <button type="button" id="searchTitle" class="secondary-btn">
                    Search By Title
                </button>

                <button type="button" id="searchCategory" class="secondary-btn">
                    Search By Category
                </button>

            </div>

        </section>


        <!-- Products Table -->
        <section class="table-wrapper">

            <table id="productsTable">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Taxes</th>
                        <th>Ads</th>
                        <th>Discount</th>
                        <th>Total</th>
                        <th>Category</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <!--
                    JavaScript will insert products here
                    Example:
                    <tr>
                        ...
                    </tr>
                -->
                <tbody id="productsBody"></tbody>

            </table>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="main.js"></script>

</body>

</html>
